name: reproduce

# Regenerates all figures from the data on a clean machine, to check that the repository still
# reproduces them. Runs only when started manually: Actions tab > reproduce > Run workflow.
# The plasma chemistry model is not run here: its chemistry set may not be redistributed.

on:
  workflow_dispatch:

jobs:
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv run reproduce.py
      - uses: actions/upload-artifact@v4
        with:
          name: figures
          path: output/
