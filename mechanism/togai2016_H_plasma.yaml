description: |-
  Hydrogen/electron subset of the plasma-assisted oxidation mechanism of

    K. Togai, N. Tsolas, R.A. Yetter,
    "Kinetic modeling and sensitivity analysis of plasma-assisted oxidation
     in a H2/O2/Ar mixture",
    Combustion and Flame 164 (2016) 239-249.
    doi:10.1016/j.combustflame.2015.11.020

  Transcribed from Supplementary Material 1 (1-s2.0-S0010218015004149-mmc1.pdf),
  which lists 424 reactions among 39 species for the full Ar/O2/H2O system.
  This file keeps ONLY the reactions whose species are built from hydrogen
  and/or electrons: e, H, H2, H+, H-, H2+, H3+.  Bracketed numbers below are
  the reaction numbers of the original supplement, so every rate here can be
  traced back to its source row.  The complete 424-reaction listing is dumped
  alongside this file in togai2016_all_rates.txt.

  ---------------------------------------------------------------------------
  WHAT IS AND IS NOT HERE
  ---------------------------------------------------------------------------
  18 reactions in the source are H/electron-only.  14 of them appear below.
  The four that do not are electron-impact reactions whose rates the authors
  did not fit to any analytic form: the supplement marks them "k(sigma)",
  meaning the rate was evaluated by BOLSIG+ from LXCat cross sections at each
  EEDF.  Those cross sections are not reproduced in the supplement, so no
  faithful conversion exists.  They are, with the source's cross-section refs:

    [67] e + H  <=> H+ + e + e      Morgan database (LXcat)
    [69] e + H2  => H + H + e       IST-Lisbon (via a3Sg+)   ) four declared
    [70] e + H2  => H + H + e       IST-Lisbon (via b3Su+)   ) duplicates,
    [71] e + H2  => H + H + e       IST-Lisbon (via c3Pu)    ) each a separate
    [72] e + H2  => H + H + e       IST-Lisbon (via e3Su+)   ) excited channel
    [74] e + H2 <=> H2+ + e + e     IST-Lisbon (LXcat)

  Reactions [67] and [74] are declared reversible in the source AND carry
  explicit reverse Arrhenius coefficients.  Those reverse directions are
  analytic, so they ARE included below as irreversible reactions R1 and R4.
  To recover the forward directions, add cross-section data for the six
  reactions above as Cantera "electron-collision-plasma" reactions.

  ---------------------------------------------------------------------------
  THERMODYNAMIC DATA -- NOT FROM THE SOURCE PAPER
  ---------------------------------------------------------------------------
  The supplement tabulates kinetics only; no thermo file is provided, yet
  eight of the reactions below are reversible and Cantera derives their
  reverse rates from thermodynamics.  Provenance of each species:

    H, H2, H+, H-, H2+   NASA7 polynomials taken verbatim from Cantera's
                         nasa_gas.yaml (NASA Glenn / Gurvich; notes retained).
    e                    constant-cp, from the NASA Glenn electron reference
                         species (Chase 1998): h0(298.15) = 0,
                         s0 = 20.979 J/mol/K, cp0 = 5/2 R.  Deliberately given
                         with no upper temperature limit, because in a plasma
                         phase Cantera evaluates electron properties at the
                         ELECTRON temperature, which far exceeds the 6000 K
                         ceiling of a normal polynomial.
    H3+                  COMPUTED HERE, not taken from a database.  No NASA
                         polynomial for H3+ ships with Cantera and Burcat's
                         database was unreachable.  Rigid-rotor / harmonic-
                         oscillator statistical mechanics on the spectroscopic
                         constants of the D3h equilateral-triangle ground
                         state: r0 = 0.8770 A (giving A = B = 43.49 cm^-1,
                         C = 21.75 cm^-1 against literature B0 = 43.57),
                         symmetry number 6, singlet ground state, vibrational
                         fundamentals nu1 = 3178.3 cm^-1 (a1') and
                         nu2 = 2521.3 cm^-1 (e', doubly degenerate).
                         Enthalpy of formation is anchored to the H2 and H+
                         polynomials shipped in this same file via the
                         convention-free dissociation energy
                         D0(H3+ -> H2 + H+) = 4.3712 eV = 421.76 kJ/mol,
                         combined at 298.15 K using JANAF H(298)-H(0) values
                         (H2 8.468, H+ 6.197, H3+ 9.916 kJ/mol).  The anchor is
                         applied at 298.15 K rather than at 0 K on purpose: the
                         H2 polynomial is only valid down to 200 K and
                         extrapolates to a spurious H(0) = -8.468 kJ/mol, which
                         would bias the H2 + H+ <=> H3+ equilibrium by exactly
                         that amount.  As shipped,
                         dH(298.15) for H2 + H+ -> H3+ = -426.5 kJ/mol.
                         Tabulated proton affinities of H2 cluster near
                         422 kJ/mol but differ between sources in whether the
                         proton carries 5/2 RT, a ~6 kJ/mol convention spread;
                         the D0 anchor above sidesteps that and is the right
                         choice for the 2000-4000 K equilibrium constant this
                         file is meant to be used at.  The NASA9 fit reproduces the underlying
                         RRHO Cp, H and S to better than 0.02 J/mol/K and
                         0.0004 kJ/mol over 200-6000 K.
                         CAVEAT: near room temperature the classical rotor is
                         only marginal for H3+ (theta_rot = 63 K, so
                         T/theta_rot ~ 5 at 298 K) and nuclear-spin symmetry
                         restrictions are treated only through the symmetry
                         number.  Expect ~1-2 J/mol/K of entropy error at
                         300 K, falling away rapidly with temperature; at the
                         2000-4000 K where this mechanism is used the harmonic
                         approximation, not the rotor, is the limiting error.
                         H3+ enters reactions R7 [152], R9 [159] and R13 [278].

  ---------------------------------------------------------------------------
  OTHER THINGS WORTH KNOWING BEFORE YOU USE THIS
  ---------------------------------------------------------------------------
  * Rates carrying an electron-temperature dependence are expressed with
    Cantera's "two-temperature-plasma" type,
      k = A * Te^b * exp(-Ea_gas/RT) * exp(Ea_electron*(Te-T)/(R*T*Te)),
    which reduces to a pure Te-Arrhenius when Ea_gas == Ea_electron.  The
    source writes these as exp(-X/Te) with X in kelvin; X has been multiplied
    by R = 1.9872036 cal/mol/K to reach the cal/mol used here.  Factors of
    (300/Te)^n have been folded into A as A*300^n with b = -n.
  * Reaction R14 [400] inherits third-body efficiencies H2 = 2.5 from the
    source.  The source also declares H2O = 12 and AR = 0; both species are
    absent from this subset, so those entries are dropped.  AR = 0 exists
    there only because the source carries a separate H2 + AR reaction [401].
  * Third-body efficiency of the ELECTRON in R7 [152] and R14 [400] defaults
    to 1.0, inherited from the source's Chemkin file, which declares no
    efficiency for E.  Treating electrons as ordinary collision partners for
    H2 dissociation is questionable; override it if it matters to you.
  * Reaction R6 [151], H+ + H => H2+, is bimolecular with no third body -- a
    radiative association, transcribed as written in the source.
  * TWO PHASES are defined.  'H_plasma' (thermo: plasma) is the one to use for
    a genuinely two-temperature calculation: set gas.Te independently of gas.T.
    Cantera 3.2 cannot put a plasma phase in any reactor class, so it supports
    rate evaluation, equilibrium and net_production_rates only.  For reactor
    networks use 'H_plasma_thermal' (thermo: ideal-gas), which is identical
    except that the Te-dependent rates collapse to Te == T.
  * No transport model is declared: the source supplement tabulates kinetics
    only and provides no collision integrals or Lennard-Jones parameters, so
    there is nothing faithful to transcribe.  This file supports thermo and
    kinetics (0-D reactors, equilibrium, rate evaluation).  Add a transport
    block from an external source if you need diffusion or a 1-D flame.
  * The 8 reversible reactions here contain no electrons, so their reverse
    rates depend only on gas-temperature thermodynamics.  No reverse rate in
    this file mixes gas and electron temperatures.

generator: transcribed by hand from the published supplement (2026-08-26)
input-files: [1-s2.0-S0010218015004149-mmc1.pdf]

units: {length: cm, quantity: mol, activation-energy: cal/mol}

phases:
  - name: H_plasma
    thermo: plasma
    elements: [H, E]
    species: [E, H, H2, H+, H-, H2+, H3+]
    kinetics: bulk
    reactions: all
    # shape-factor 1.0 = Maxwellian EEDF, so the electron temperature can be set
    # directly (gas.Te = ...). The source's rates were generated with BOLSIG+
    # EEDFs; this only sets Cantera's default starting point.
    electron-energy-distribution: {type: isotropic, shape-factor: 2.0, mean-electron-energy: 1.0 eV}
    state: {T: 3000, P: 100e2, X: {H2: 1.0}}

species:
  - name: E
    composition: {E: 1}
    thermo:
      model: constant-cp
      T0: 298.15 K
      h0: 0.0 J/mol
      s0: 20.978882 J/mol/K
      cp0: 20.786157 J/mol/K
    note: |-
      NASA Glenn electron reference species (Chase 1998), recast as constant-cp
      so that it stays valid at electron temperatures above 6000 K.

  - name: H
    composition: {H: 1}
    thermo:
      model: NASA7
      temperature-ranges: [200.0, 1000.0, 6000.0]
      data:
        - [2.5, 0.0, 0.0, 0.0, 0.0, 25473.6599, -0.446682853]
        - [2.50000286, -5.65334214e-09, 3.63251723e-12, -9.1994972e-16, 7.95260746e-20, 25473.6589, -0.446698494]
    note: L 5/93 (via Cantera nasa_gas.yaml)

  - name: H2
    composition: {H: 2}
    thermo:
      model: NASA7
      temperature-ranges: [200.0, 1000.0, 6000.0]
      data:
        - [2.34433112, 0.00798052075, -1.9478151e-05, 2.01572094e-08, -7.37611761e-12, -917.935173, 0.683010238]
        - [2.93286579, 0.000826607967, -1.46402335e-07, 1.54100359e-11, -6.88804432e-16, -813.065597, -1.02432887]
    note: TPIS78 (via Cantera nasa_gas.yaml)

  - name: H+
    composition: {H: 1, E: -1}
    thermo:
      model: NASA7
      temperature-ranges: [298.15, 6000.0]
      data:
        - [2.5, 0.0, 0.0, 0.0, 0.0, 184021.428, -1.14064453]
    note: L 7/88 (via Cantera nasa_gas.yaml)

  - name: H-
    composition: {H: 1, E: 1}
    thermo:
      model: NASA7
      temperature-ranges: [298.15, 6000.0]
      data:
        - [2.5, 0.0, 0.0, 0.0, 0.0, 15976.167, -1.13901598]
    note: L/7/88 (via Cantera nasa_gas.yaml)

  - name: H2+
    composition: {H: 2, E: -1}
    thermo:
      model: NASA7
      temperature-ranges: [298.15, 1000.0, 6000.0]
      data:
        - [3.77256072, -0.00195746589, 4.54812047e-06, -2.82152141e-09, 5.33969209e-13, 178694.104, -3.96609086]
        - [3.44204765, 0.000599083239, 6.69133685e-08, -3.43574373e-11, 1.97626599e-15, 178649.686, -2.79498949]
    note: TPIS78 (via Cantera nasa_gas.yaml)

  - name: H3+
    composition: {H: 3, E: -1}
    thermo:
      model: NASA9
      temperature-ranges: [200.0, 1000.0, 6000.0]
      data:
        - [5.85113581e+04, -9.29448872e+02, 9.72971229e+00, -1.70609183e-02, 2.45060982e-05,
           -1.45332849e-08, 3.18754943e-12, 1.36629858e+05, -3.63839275e+01]
        - [2.29811328e+06, -7.45471146e+03, 1.12679897e+01, -1.38731350e-03, 2.60277253e-07,
           -2.62029052e-11, 1.09396440e-15, 1.79661759e+05, -6.00052060e+01]
    note: |-
      NOT from the source paper. RRHO fit computed for this file; see the
      THERMODYNAMIC DATA section of the file description for constants,
      anchoring and error bounds. Hf(298.15) = 1109.7 kJ/mol on the same
      electron convention as the H+ entry above.

reactions:
  # R1 <- [67], reverse direction only.  Three-body electron-ion recombination.
  # Source: e + H <=> H+ + e + e, forward is k(sigma); this is its declared
  # reverse Arrhenius, 4.44e28*(300/Te)^4.5, refs [26,27].
  - equation: H+ + e + e => H + E
    type: two-temperature-plasma
    rate-constant: {A: 6.229148e+39, b: -4.5, Ea-gas: 0.0, Ea-electron: 0.0}

  # R2 <- [68].  Dissociative attachment, 2.03e8*(Te/300)^0.64*exp(-9.20/Te), ref [14] (UMIST 2012).
  - equation: e + H => H-
    type: two-temperature-plasma
    rate-constant: {A: 5.273979e+06, b: 0.64, Ea-gas: 18.28227, Ea-electron: 18.28227}

  # R3 <- [73].  Associative detachment, ref [14].
  - equation: H- + H => H2 + e
    rate-constant: {A: 2.41e+16, b: -0.39, Ea: 78.3}

  # R4 <- [74], reverse direction only.  Source: e + H2 <=> H2+ + e + e,
  # forward is k(sigma); declared reverse Arrhenius 2.73e28*(300/Te)^4.5, ref [10].
  - equation: H2+ + e + e => H2 + e
    type: two-temperature-plasma
    rate-constant: {A: 3.830084e+39, b: -4.5, Ea-gas: 0.0, Ea-electron: 0.0}

  # R5 <- [75].  3.82e20*Te^-0.87*exp(-80265.1/Te), ref [29] (Riahi et al. 2006).
  # - equation: e + H2+ => H + H
  #   type: two-temperature-plasma
  #   rate-constant: {A: 3.82e+20, b: -0.87, Ea-gas: 159503.096, Ea-electron: 159503.096}

  # R6 <- [151].  Radiative association as written in the source, ref [14].
  - equation: H+ + H => H2+
    rate-constant: {A: 1.41e+02, b: 1.49, Ea: 453.1}

  # R7 <- [152].  Ref [42] (Matveyev & Silakov 1995).
  - equation: H+ + H2 + M <=> H3+ + M
    type: three-body
    rate-constant: {A: 1.95e+20, b: -0.5, Ea: 0.0}

  # R8 <- [158].  Charge transfer, ref [14].
  # - equation: H2+ + H <=> H2 + H+
  #   rate-constant: {A: 3.85e+14, b: 0.0, Ea: 0.0}

  # R9 <- [159].  Proton transfer, ref [14].
  # - equation: H2+ + H2 <=> H3+ + H
  #   rate-constant: {A: 1.25e+15, b: 0.0, Ea: 0.0}

  # R10 <- [223].  Mutual neutralisation, ref [14].
  # - equation: H- + H+ <=> H + H
  #   rate-constant: {A: 7.83e+17, b: -0.5, Ea: 0.0}

  # R11 <- [224].  Mutual neutralisation, ref [14].
  - equation: H- + H2+ <=> H + H2
    rate-constant: {A: 7.83e+17, b: -0.5, Ea: 0.0}

  # R12 <- [277].  Dissociative mutual neutralisation, refs [6,11].
  # - equation: H- + H2+ <=> H + H + H
  #   rate-constant: {A: 6.02e+16, b: 0.0, Ea: 0.0}

  # R13 <- [278].  Dissociative mutual neutralisation, ref [14].
  - equation: H- + H3+ <=> H2 + H + H
    rate-constant: {A: 7.83e+17, b: -0.5, Ea: 0.0}

  # R14 <- [400].  Thermal dissociation, ref [80]; the neutral H2/O2 base
  # mechanism of the source paper.  See the file description on efficiencies.
  # - equation: H2 + M <=> H + H + M
  #   type: three-body
  #   rate-constant: {A: 4.58e+19, b: -1.40, Ea: 104380.0}
  #   efficiencies: {H2: 2.5}
