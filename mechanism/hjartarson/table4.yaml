description: |-
  Table 4 reactions (R34-R50) from:

  A T Hjartarson, E G Thorsteinsson and J T Gudmundsson, "Low pressure hydrogen
  discharges diluted with argon explored using a global model," Plasma Sources
  Sci. Technol. 19 (2010) 065008. doi:10.1088/0963-0252/19/6/065008

  The hydrogen reaction set (ground-vibrational-state only; the vibrationally
  resolved reactions of table 5 are in table5.yaml).

  Electron-impact reactions fitted to k = A * Te^b * exp(-Ea/Te) [m^3 s^-1],
  with Te and Ea in eV, are implemented with Cantera's "two-temperature-plasma"
  rate type and Ea-gas = Ea-electron = Ea (see table2.yaml for the full
  derivation and unit-conversion formula, including the kB_eV^b correction
  needed because Cantera's Te enters the power-law term in kelvin).

  Reactions given as plain numbers (no Te dependence: R38, R41, R47) are
  implemented as constant-rate Arrhenius reactions (b = 0, Ea = 0).

  R42-R44 are fits of the form k = A * (300 K / Tg)^0.5, i.e. genuine
  Arrhenius dependence on the actual (heavy-particle/gas) temperature Tg, so
  these use Cantera's default Arrhenius rate type directly with
  A' = A_paper * 300^0.5 (converted to molar units), b = -0.5, Ea = 0.

  R40 (dissociative recombination of H3+) is a sum of two Te-fitted terms; it
  is implemented as two duplicate reactions with the same equation. The
  second term's paper form exp(-6.45/(Te+0.10)) cannot be represented exactly
  by the two-temperature-plasma rate (which requires a bare Te in the
  denominator); the +0.10 eV offset is dropped, which is a <10% effect on the
  exponential at Te ~ 1-10 eV.

  R47 is printed in the paper as "H2 + H -> H3+ + hbar*omega" (radiative
  association), but that does not conserve charge (H2 and H are both
  neutral, H3+ is not); it is implemented here as H2+ + H => H3+, the
  well-known ion-neutral radiative association reaction discussed in the
  paper's own cited reference [61] (Gerlich and Horning 1992), which most
  likely lost its "+" superscript on H2 in typesetting/OCR. Its
  rate-coefficient units are also printed as "s^-1", dimensionally
  inconsistent with a bimolecular reaction; the table 4 header states all
  rate coefficients are in m^3 s^-1, so it is treated here as a bimolecular
  m^3/s coefficient (most likely a dropped "m^3" in the original
  typesetting).

  Bracketed numbers in trailing comments are the original references [N] from
  table 4 of the paper (its own reference list, not this file's).

units: { length: cm, time: s, quantity: mol, activation-energy: eV }

reactions:
  - equation: e + H2 => H2+ + e + e  # (R34) [33]
    type: two-temperature-plasma
    rate-constant: {A: 1.300170e+14 cm^3/mol/s, b: 0.420, Ea-gas: 16.050 eV, Ea-electron: 16.050 eV}
  - equation: e + H2 => H + H + e  # (R35) [33]
    type: two-temperature-plasma
    rate-constant: {A: 2.451751e+17 cm^3/mol/s, b: -0.230, Ea-gas: 10.090 eV, Ea-electron: 10.090 eV}
  - equation: e + H2 => H + H-  # (R36) [33,57]
    type: two-temperature-plasma
    rate-constant: {A: 2.083133e+17 cm^3/mol/s, b: -1.040, Ea-gas: 9.040 eV, Ea-electron: 9.040 eV}
  - equation: e + H => H+ + e + e  # (R37) [42]
    type: two-temperature-plasma
    rate-constant: {A: 1.024073e+14 cm^3/mol/s, b: 0.410, Ea-gas: 14.230 eV, Ea-electron: 14.230 eV}
  - equation: H + H2+ => H2 + H+  # (R38) [39]
    rate-constant: {A: 3.854170e+14 cm^3/mol/s, b: 0.0, Ea: 0.0 eV}
  - equation: e + H2+ => H + H+ + e  # (R39) [58]; cross-section magnitude reduced by 70% (footnote a), already applied to A
    type: two-temperature-plasma
    rate-constant: {A: 4.356255e+18 cm^3/mol/s, b: -0.390, Ea-gas: 28.820 eV, Ea-electron: 28.820 eV}
  - equation: e + H3+ => H2+ + H-  # (R40) [58], term 1 of 2 (see second R40 entry below)
    type: two-temperature-plasma
    duplicate: true
    rate-constant: {A: 2.596924e+18 cm^3/mol/s, b: -1.070, Ea-gas: 2.700 eV, Ea-electron: 2.700 eV}
  - equation: e + H3+ => H2+ + H-  # (R40) [58], term 2 of 2; paper form exp(-6.45/(Te+0.10)) approximated as exp(-6.45/Te)
    type: two-temperature-plasma
    duplicate: true
    rate-constant: {A: 2.265307e+20 cm^3/mol/s, b: -1.270, Ea-gas: 6.450 eV, Ea-electron: 6.450 eV}
  - equation: H2 + H2+ => H + H3+  # (R41) [39]
    rate-constant: {A: 1.204428e+15 cm^3/mol/s, b: 0.0, Ea: 0.0 eV}
  - equation: H+ + H- => H + H  # (R42) [59], k = A*(300/Tg)^0.5, real gas temperature Tg
    rate-constant: {A: 1.335124e+18 cm^3/mol/s, b: -0.500, Ea: 0.0 eV}
  - equation: H2+ + H- => H + H + H  # (R43) [59], k = A*(300/Tg)^0.5, real gas temperature Tg
    rate-constant: {A: 8.647012e+18 cm^3/mol/s, b: -0.500, Ea: 0.0 eV}
  - equation: H3+ + H- => H + H + H + H  # (R44) [59], k = A*(300/Tg)^0.5, real gas temperature Tg
    rate-constant: {A: 8.647012e+18 cm^3/mol/s, b: -0.500, Ea: 0.0 eV}
  - equation: e + H- => H + e + e  # (R45) [60]
    type: two-temperature-plasma
    rate-constant: {A: 5.639411e+17 cm^3/mol/s, b: 0.030, Ea-gas: 10.440 eV, Ea-electron: 10.440 eV}
  - equation: e + H3+ => H + H + H+ + e  # (R46) [58]
    type: two-temperature-plasma
    rate-constant: {A: 1.887291e+15 cm^3/mol/s, b: 0.370, Ea-gas: 14.460 eV, Ea-electron: 14.460 eV}
  - equation: H2 + H+ => H3+  # (R47) [61], radiative association (see note on units above)
    rate-constant: {A: 9.816089e+08 cm^3/mol/s, b: 0.0, Ea: 0.0 eV}
  - equation: e + H2+ => H + H  # (R48) [62]
    type: two-temperature-plasma
    rate-constant: {A: 3.349407e+14 cm^3/mol/s, b: 0.400, Ea-gas: 0.000 eV, Ea-electron: 0.000 eV}
  - equation: e + H3+ => H + H + H  # (R49) [62]
    type: two-temperature-plasma
    rate-constant: {A: 7.387429e+11 cm^3/mol/s, b: 0.800, Ea-gas: 0.000 eV, Ea-electron: 0.000 eV}
  - equation: e + H3+ => H + H2  # (R50) [62]
    type: two-temperature-plasma
    rate-constant: {A: 2.462476e+11 cm^3/mol/s, b: 0.800, Ea-gas: 0.000 eV, Ea-electron: 0.000 eV}
