    type: two-temperature-plasma
    rate-constant: {A: 5.537946e+13 cm^3/mol/s, b: 0.590, Ea-gas: 17.440 eV, Ea-electron: 17.440 eV}
  - equation: e + Ar => e + Arm  # (2) [57], channel a into lumped Arm (see also #3)
    type: two-temperature-plasma
    duplicate: true
    rate-constant: {A: 3.011070e+15 cm^3/mol/s, b: 0.0, Ea-gas: 12.640 eV, Ea-electron: 12.640 eV}
