description: |-
  Table III reactions from:

  E Kemaneci, F Mitschker, M Rudolph, D Szeremley, D Eremin, P Awakowicz and
  R P Brinkmann, "A global model of cylindrical and coaxial surface-wave
  discharges," arXiv:1612.07268 [physics.plasm-ph] (2016).

  "Argon plasma reactions. We adopt the chemical set by Gudmundsson et al [50]
  and additionally include the argon excimer ion kinetics as well as
  three-body recombination by Jimenez et al [12] or Kabouzi et al [51]." The
  base chemical set (reactions #1-26) is the same lumped 4-level argon model
  (Ar, Arm, Arr, Ar(4p)) used in ../hjartarson/table2.yaml (Gudmundsson and
  Thorsteinsson 2007), refit with slightly different coefficients in this
  paper; species names here follow the same convention (Arm = lumped
  metastable 1s5+1s3, Arr = lumped radiatively-coupled 1s4+1s2, Ar(4p) =
  lumped 4p manifold) so that this table can be combined with
  ../hjartarson/main.yaml's species if desired. Reactions #27-33 add the
  argon dimer ion Ar2+ (excimer ion) kinetics; Ar2+ is not defined in this
  reactions-only file (see note below).

  Unit conversion methodology (rate coefficients, electron/gas temperatures):
  the paper's header states rate coefficients are in m^3 s^-1 (m^6 s^-1 for
  the explicit three-body reactions #30, #32, #33) and, unless a bracketed
  unit tag says otherwise, electron temperature Te is in eV and gas/heavy-
  particle temperature Th is in K.

    - Two-body reactions fitted as A * Te[eV]^b * exp(-Ea[eV]/Te[eV])
      (reactions #1-10, #15-18, #20, #22) are implemented with Cantera's
      "two-temperature-plasma" rate type and Ea-gas = Ea-electron = Ea, which
      makes the gas-temperature dependence cancel exactly (see
      ../hjartarson/table2.yaml for the full derivation). Because Cantera's
      Te enters the power-law term in kelvin rather than eV, the
      pre-exponential factor also picks up a kB_eV^b correction, kB_eV =
      8.617333262e-5 eV/K, on top of the usual particle -> molar conversion
      (x 1e6 cm^3/m^3 x N_A).
    - Reactions given as plain numbers (no Te dependence: #9, #11-14, #19,
      #21) are implemented as constant-rate Arrhenius reactions (b=0, Ea=0).
    - Reactions #23-26 are unimolecular radiative decays, in s^-1 directly
      (no conversion needed for a first-order rate constant).
    - Reactions #27, #28 are fit as A * (Te[K]/300)^-0.67 * f(Th), where
      f(Th) = (1 - exp(-418/Th)) / (1 - 0.31*exp(-418/Th)) is a branching
      fraction between the Arm and Arr channels of Ar2+ dissociative
      recombination (Kabouzi et al). Because Te is explicitly in kelvin here,
      it maps onto Cantera's native Te[K] directly with NO kB_eV correction;
      but f(Th) is not representable by Cantera's built-in rate expressions,
      so it is evaluated once at a fixed reference gas temperature Th_ref =
      500 K (matching the default Tg used throughout ../hjartarson/) and
      folded into the pre-exponential factor as a constant. f(500 K) =
      0.65450. If you run at a substantially different gas temperature,
      recompute A = 1.04e-12 * 300^0.67 * f(Th) * 1e6 * N_A.
    - Reaction #29 is fit as A * exp(-(2.94 - 3*(Th[eV]-0.026))/Te[eV]), i.e.
      an activation energy that is itself linear in Th. It is likewise
      evaluated at the fixed reference Th_ref = 500 K (Th[eV] = 0.043087 eV),
      giving Ea_eff = 2.88874 eV, and implemented as an ordinary
      two-temperature-plasma reaction (b=0) with that fixed Ea.
    - Reaction #30 is a three-body reaction fit as A * (Th[K]/300)^-0.4 using
      the real gas temperature natively in kelvin, so it needs no eV
      correction; implemented as a plain (gas-temperature) Arrhenius
      reaction with cm^6/mol^2/s units.
    - Reaction #31 is a two-body, heavy-particle-only reaction fit as
      A * Th[eV]^-1.0 * exp(-1.304/Th[eV]) -- both terms use Th in eV, so it
      needs the same kB_eV^b pre-factor correction as the Te[eV]-based
      reactions above, but applied with Cantera's plain (gas-temperature)
      Arrhenius rate type since no electron is involved.
    - Reactions #32, #33 are three-body electron-ion recombination, fit as
      A * Te[eV]^b with no exponential term; implemented as
      two-temperature-plasma with cm^6/mol^2/s units and the same kB_eV^b
      correction (very large here because b is large and negative:
      -4.5 and -2.25).

  All conversion formulas above were verified by loading the resulting
  reactions in Cantera 3.2.0 and confirming k(Te, Tg) reproduces the paper's
  formulas to 6 significant figures over Te = 1-5 eV at Tg = 500 K.

  Notes on specific reactions:
    - #2/#3 and #4/#5 are two separate literature cross sections that both
      feed the same lumped Arm / Arr state; both are kept (marked
      `duplicate: true`) so their rates add, rather than overwriting one
      another.
    - #12 is printed in the paper as "Ar + Ar+ -> Ar + Ar+" with a "?"
      annotation next to the reaction number; reactants and products are
      identical, so it has no net effect on species densities. It is most
      likely the resonant charge-exchange collision used elsewhere in the
      paper to compute the ion mean free path / mobility, not a true
      production/loss channel, but it is included here as printed for
      completeness.
    - #14 is printed twice under the same reaction number for two different
      reactions (Ar(4p)+Ar(4p) and Arm+Arm associative ionization); both are
      kept and labeled #14a / #14b in the trailing comments.
    - Ar2+ (argon dimer/excimer cation) is used as a reactant/product in
      reactions #27-31 but is not defined in this reactions-only file. Add a
      NASA7 (or other) thermo entry for it, e.g. alongside Arm/Arr/Ar(4p) in
      ../hjartarson/main.yaml, before combining this table into a runnable
      phase.

units: { length: cm, time: s, quantity: mol, activation-energy: eV }

