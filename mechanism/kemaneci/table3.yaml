    rate-constant: {A: 4.435278e+30 cm^6/mol^2/s, b: -2.250, Ea-gas: 0.0, Ea-electron: 0.0}

species:
  # Argon dimer ion. Enthalpy is anchored to nasa_gas.yaml's Ar+ and Ar:
  #   Hf(Ar2+) = Hf(Ar+) + Hf(Ar) - D0,  D0 = 1.32 eV [VMI]
  # which puts Ar2+ 14.504 eV above two ground-state Ar atoms. (nasa_gas.yaml's
  # own Ar+/Ar pair implies IP = 15.824 eV, 0.064 eV above the spectroscopic
  # 15.7596 eV; the offset is inherited here so the mechanism stays internally
  # consistent.)
  # cp = 3.5 R -- translation + rotation only, rigid rotor, vibration neglected
  # (omega_e ~ 309 cm^-1, so this underestimates cp above ~1000 K).
  # a7 is set from Sackur-Tetrode + rigid rotor (re = 2.42 A, sigma = 2) plus
  # R ln 2 for the X 2Sigma_u+ doublet, giving S(298) = 232.1 J/mol/K.
  # As in main.yaml this thermo is a placeholder: every reaction above is
  # irreversible, so no reverse rate is ever derived from it. It is accurate
  # enough for the energy balance, NOT for equilibrium calculations.
  - name: Ar2+
    composition: { Ar: 2, E: -1 }
    thermo:
      model: NASA7
      temperature-ranges: [200.0, 6000.0]
      data:
        - [3.5, 0.0, 0.0, 0.0, 0.0, 1.67266697e+05, 7.97958798e+00]
      note: Ar2+ placeholder, Hf from Hf(Ar+) - D0(Ar2+); see comment above.
